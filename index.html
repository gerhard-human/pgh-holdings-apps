<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PGH Holdings apps</title>
<style>
  :root {
    color-scheme: light dark;
    --ground: #E9E7E2;
    --ink: #212226;
    --muted: #55565b;
    --rule: #cfccc5;
    --signal: #2F5DE0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #17181A;
      --ink: #E9E7E2;
      --muted: #a8a9ad;
      --rule: #31333A;
      --signal: #8AA9F5;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding-block: 40px;
    padding-inline: 20px;
    background: var(--ground);
    color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 42rem; margin: 0 auto; }
  h1 { font-size: 1.9rem; line-height: 1.25; margin: 0 0 .25rem; }
  h2 { font-size: 1.2rem; line-height: 1.3; margin: 2.4rem 0 .6rem; }
  h3 { font-size: 1rem; margin: 1.6rem 0 .4rem; }
  p, li { color: var(--ink); }
  .lede { color: var(--muted); margin: 0 0 2rem; }
  a { color: var(--signal); }
  hr { border: 0; border-top: 1px solid var(--rule); margin: 2.5rem 0; }
  ul { padding-left: 1.2rem; }
  li { margin: .35rem 0; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .92em; }
  .note { color: var(--muted); font-size: .92rem; }
  footer { margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--rule); color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<main>

<h1>PGH Holdings apps</h1>
<p class="lede">Apps published by PGH Holdings (Pty) Ltd.</p>

<h2><a href="companion-remote/">Companion Remote</a></h2>
<p>An Android remote for Apple TV, with no adverts, tracking or account.</p>

<footer>
  PGH Holdings (Pty) Ltd.
  <a href="mailto:pgh-holdings-apps@proton.me">pgh-holdings-apps@proton.me</a>
</footer>

</main>
</body>
</html>
